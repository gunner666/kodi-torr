<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repositorio de Archivos</title>
    <!-- Tailwind CSS para el diseño -->
    <script src="https://tailwindcss.com"></script>
    <!-- FontAwesome para los iconos de carpetas y archivos -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        .tree-node { margin-left: 20px; }
        .nested { display: none; }
        .active { display: block; }
        .caret::before { content: "\f0da"; font-family: "Font Awesome 6 Free"; font-weight: 900; margin-right: 6px; display: inline-block; transition: transform 0.2s; }
        .caret-down::before { transform: rotate(90deg); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <div class="max-w-4xl mx-auto p-6">
        <header class="mb-8 border-b pb-4">
            <h1 class="text-3xl font-bold text-gray-900 flex items-center gap-3">
                <i class="fab fa-github text-4xl"></i> Explorador de Archivos
            </h1>
            <p class="text-sm text-gray-500 mt-1">Repositorio: <span id="repo-title" class="font-semibold text-blue-600">Cargando...</span></p>
        </header>

        <!-- Contenedor principal del árbol -->
        <main class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
            <div id="file-tree" class="select-none text-lg space-y-1">
                <div class="text-gray-500 animate-pulse flex items-center gap-2">
                    <i class="fas fa-spinner animate-spin"></i> Cargando estructura del repositorio...
                </div>
            </div>
        </main>
    </div>

    <script>
        // CONFIGURACIÓN: Reemplaza con tus datos reales de GitHub
        const USERNAME = 'gunner666'; 
        const REPO = 'kodi-torr';
        const BRANCH = 'main'; // Cambia a 'master' si tu rama principal se llama así

        document.getElementById('repo-title').textContent = `${USERNAME}/${REPO}`;

        async function fetchRepoTree() {
            const url = `https://github.com{USERNAME}/${REPO}/git/trees/${BRANCH}?recursive=1`;
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('No se pudo obtener el repositorio. Verifica la configuración.');
                const data = await response.json();
                buildTree(data.tree);
            } catch (error) {
                document.getElementById('file-tree').innerHTML = `
                    <div class="text-red-500 font-medium">
                        <i class="fas fa-exclamation-triangle"></i> Error: ${error.message}
                    </div>`;
            }
        }

        function buildTree(files) {
            const treeContainer = document.getElementById('file-tree');
            treeContainer.innerHTML = ''; // Limpiar cargador

            // Estructura raíz
            const root = {};

            // Construir objeto anidado a partir de las rutas planas de GitHub
            files.forEach(file => {
                const pathParts = file.path.split('/');
                let currentLevel = root;

                pathParts.forEach((part, index) => {
                    if (!currentLevel[part]) {
                        currentLevel[part] = {
                            _type: (index === pathParts.length - 1) ? file.type : 'tree',
                            _path: file.path
                        };
                    }
                    currentLevel = currentLevel[part];
                });
            });

            // Función recursiva para renderizar el HTML
            function render(obj, parentElement) {
                // Ordenar para mostrar primero carpetas y luego archivos
                const sortedKeys = Object.keys(obj)
                    .filter(key => !key.startsWith('_'))
                    .sort((a, b) => {
                        if (obj[a]._type === 'tree' && obj[b]._type !== 'tree') return -1;
                        if (obj[a]._type !== 'tree' && obj[b]._type === 'tree') return 1;
                        return a.localeCompare(b);
                    });

                sortedKeys.forEach(key => {
                    const node = obj[key];
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'tree-node my-1';

                    if (node._type === 'tree' || node._type === 'blob') {
                        const link = document.createElement('span');
                        link.className = 'cursor-pointer hover:text-blue-600 transition flex items-center py-0.5';

                        if (node._type === 'tree') {
                            // Es una carpeta
                            link.classList.add('caret', 'font-medium', 'text-gray-700');
                            link.innerHTML += `<i class="fas fa-folder text-yellow-500 mr-2"></i> ${key}`;
                            
                            const childContainer = document.createElement('div');
                            childContainer.className = 'nested';
                            
                            link.addEventListener('click', function() {
                                this.classList.toggle('caret-down');
                                childContainer.classList.toggle('active');
                            });

                            itemDiv.appendChild(link);
                            render(node, childContainer);
                            itemDiv.appendChild(childContainer);
                        } else {
                            // Es un archivo
                            link.className = 'text-gray-600 hover:text-blue-600 ml-5 flex items-center';
                            // URL de descarga directa desde la rama asignada
                            const fileUrl = `https://githubusercontent.com{USERNAME}/${REPO}/${BRANCH}/${node._path}`;
                            
                            link.innerHTML = `
                                <a href="${fileUrl}" target="_blank" download class="flex items-center w-full">
                                    <i class="far fa-file-alt text-gray-400 mr-2.5"></i> ${key}
                                    <i class="fas fa-download text-xs text-gray-400 opacity-0 hover:opacity-100 ml-auto transition pl-4" title="Descargar archivo"></i>
                                </a>`;
                            itemDiv.appendChild(link);
                        }
                        parentElement.appendChild(itemDiv);
                    }
                });
            }

            render(root, treeContainer);
        }

        // Inicializar la carga
        fetchRepoTree();
    </script>
</body>
</html>
